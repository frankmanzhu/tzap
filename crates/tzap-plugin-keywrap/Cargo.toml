[package]
name = "tzap-plugin-keywrap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "HPKE key-wrap recipient profiles for tzap v45"
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/tzap-plugin-keywrap"
readme = "README.md"
keywords = ["archive", "cryptography", "tzap", "keywrap", "recipient"]
categories = ["cryptography"]

[dependencies]
tzap-core.workspace = true
hpke = { workspace = true }
# X.509 recipient identities are parsed with `x509-parser` (SPKI extraction,
# key-type/curve checks). The OpenSSL crate is test-only (dev-dependency):
# certificate generation fixtures stay on it until upstream replaces them.
# pkcs8 pulls elliptic-curve/sec1 (needed for compressed-point decode).
p256 = { version = "0.13", features = ["pkcs8", "arithmetic"] }
pkcs8 = { version = "0.10", features = ["std"] }
rand_core = { version = "0.9", features = ["os_rng"] }
sha2 = { workspace = true }
x509-parser.workspace = true

[dev-dependencies]
openssl = { workspace = true }

name: Publish crates.io

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup update stable
          rustup default stable

      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          publish_if_needed() {
            crate="$1"

            version=$(cargo metadata \
              --no-deps \
              --format-version 1 \
              | jq -r --arg crate "$crate" \
                '.packages[] | select(.name == $crate) | .version')

            echo "Checking $crate v$version..."

            status=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://crates.io/api/v1/crates/$crate/$version")

            if [ "$status" = "200" ]; then
              echo "✓ $crate v$version already published — skipping"
            else
              echo "Publishing $crate v$version..."
              cargo publish -p "$crate"
            fi
          }

          publish_if_needed tzap-core
          publish_if_needed tzap-plugin-signing
          publish_if_needed tzap-plugin-keywrap
          publish_if_needed tzap